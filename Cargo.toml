[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.98"
license = "LicenseRef-Proprietary"
repository = "https://github.com/Dicobraz/srvPost"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "deny"

[workspace.dependencies]
# Внутренние крейты
tp-contracts = { path = "crates/tp-contracts" }
tp-testkit = { path = "crates/tp-testkit" }
tp-sys = { path = "crates/tp-sys" }
tp-platform = { path = "crates/tp-platform" }
tp-meta = { path = "crates/tp-meta" }
tp-blob = { path = "crates/tp-blob" }
tp-mailstore = { path = "crates/tp-mailstore" }
tp-cluster = { path = "crates/tp-cluster" }
tp-auth = { path = "crates/tp-auth" }
tp-smtp = { path = "crates/tp-smtp" }
tp-sieve = { path = "crates/tp-sieve" }
tp-imap = { path = "crates/tp-imap" }
tp-jmap = { path = "crates/tp-jmap" }
tp-dav = { path = "crates/tp-dav" }
tp-search = { path = "crates/tp-search" }
tp-admin = { path = "crates/tp-admin" }
tp-admin-client = { path = "crates/tp-admin-client" }
tp-tui = { path = "crates/tp-tui" }
# Веб-клиент (полоса mod-webmail, WEB-01): статика web/dist внутри бинарного файла; thepost, фича `webmail`.
tp-webmail = { path = "crates/tp-webmail" }
# Внешние (SRS 7.4). Добавление/обновление — только полоса deps (класс B).
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
# HTTP/2 для межузловых вызовов (решение 31, DEPS-06): фича http2 включает hyper/http2 (h2 уже в дереве);
# согласование протокола по ALPN (h2) — CLU-15.
axum = { version = "0.8.9", features = ["http2", "ws"] }
base64 = "0.23.1"
bytes = "1.12.1"
calamine = "0.38.0"
# Подсветка вывода CLI (решение 120): версии те же, что в дереве clap.
anstream = "1.0.0"
anstyle = "1.0.14"
calcard = "0.3.14"
# Метка ответа в Message-ID исходящих: AEAD XChaCha20-Poly1305, случайный nonce 24 байта (решение 125 в, DEPS-18);
# на chacha20 0.10 из дерева (proptest) — второй копии нет.
chacha20poly1305 = "0.11.0"
# Подпись профиля .mobileconfig (CMS SignedData, RFC 5652; JMAP-22): типы и DER, без builder —
# подпись ключом TLS через aws-lc-rs (builder тянет rsa: RUSTSEC-2023-0071 без исправления).
cms = { version = "0.2.3", default-features = false, features = ["std"] }
chrono = { version = "0.4.45", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
# Текстовый интерфейс `thepost admin tui` (решение 118): терминал и разметка экранов; та же ветка crossterm, что у ratatui.
crossterm = "0.29.0"
# Пиксельные координаты мыши из /dev/input на консоли Linux (решение 119, уровень 3 курсора); только Linux.
evdev = "0.13.2"
flate2 = "1.1.10"
futures = "0.3.34"
hex = "0.4.3"
# BATV prvs= в MAIL FROM исходящих: HMAC-SHA1 (решение 125 г, draft-levine-smtp-batv-01); версия та же, что у sqlx.
hmac = "0.13.0"
imap-codec = { version = "2.0.0-alpha.9", features = ["starttls", "ext_id", "ext_condstore_qresync", "ext_namespace"] }
# Сигнатуры форматов для пропуска сжатия BLOB (BLOB-13); без std: OLE-документы не распознаются, они сжимаемы.
infer = { version = "0.22.0", default-features = false, features = ["alloc"] }
insta = { version = "1.49.0", features = ["json"] }
# `time` — подсказка окна продления от сервера (ARI, RFC 9773; PLT-39): `Account::renewal_info`,
# `RenewalInfo`, `SuggestedWindow`.
instant-acme = { version = "0.8.5", features = ["time"] }
# U-label IDN — в A-label адресатов записи об отправленном (CTR-94, tp-contracts); та же версия, что уже
# в дереве через url.
idna = "1.1.0"
# Префиксы IP списков TI (решение 126, tp-smtp); та же версия, что уже в дереве через hickory и hyper-util.
ipnet = "2.12.2"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
landlock = "0.4.7"
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
libgssapi = "0.11.0"
# Без rayon: извлечение текста PDF — в подпроцессе под seccomp, где потоки запрещены (SRCH-07).
lopdf = { version = "0.46.0", default-features = false }
mail-auth = "0.15.1"
mail-builder = "1.0.0"
# 0.11 в коде крейтов; 1.0 (через mail-auth 0.14 и mail-send 0.7) меняет API разбора — отдельная карточка (DEPS-02).
mail-parser = "1.0.1"
mail-send = "0.7.0"
moka = { version = "0.12.16", features = ["future"] }
nix = { version = "0.31.3", features = ["signal", "process", "resource", "socket"] }
# imap-codec 2.0.0-alpha.9 использует nom::multi без фичи alloc: включаем её сами.
nom = { version = "8.0.0", default-features = false, features = ["alloc"] }
notify = { version = "8.2.0", default-features = false }
object_store = { version = "0.14.2", features = ["aws"] }
opentelemetry = "0.33.1"
opentelemetry-otlp = "0.33.1"
opentelemetry_sdk = "0.33.1"
ppp = "2.3.0"
prometheus-client = "0.25.1"
proptest = "1.12.0"
# Регистрируемый домен по Public Suffix List — признак «новый домен» (решение 126, tp-smtp). Сам список —
# данные пакета (MPL-2.0, раздаём без изменений), читается во время работы; punycode (idna) — домены бывают в IDN.
publicsuffix = "2.3.0"
quick-xml = "0.42.0"
rand = "0.10.3"
ratatui = "0.30.2"
# Картинки в терминале (решение 119): kitty graphics, sixel, iTerm2, полублоки — курсор мыши и знак IT TASK.
# Без chafa (системная libchafa, LGPL) и кодеков image по умолчанию: image — только PNG (его ratatui-image включает всегда).
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
# Шаблоны признаков каталога аномалий и списков TI (решение 126, tp-sieve/tp-smtp): линейное время на
# недоверенном вводе; та же версия, что уже в дереве через tantivy.
regex = "1.13.1"
# HTTP/2 для межузловых вызовов (решение 31, DEPS-06): без default-features фича http2 выключена — включаем явно.
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls"] }
# Подпись Ed25519 пакета признаков поставщика (решение 126, как карты Rspamd; thepost); без второй
# криптобиблиотеки — та же версия, что уже в дереве через rustls.
ring = "0.17.14"
rpassword = "7.5.5"
rsasl = { version = "2.3.1", default-features = false, features = ["config_builder", "provider", "plain", "login", "oauthbearer", "xoauth2"] }
# Статика веб-консоли внутри бинарного файла (SRS 5.2); tp-admin, фича `console`. Сжатие и MIME не нужны.
# deterministic-timestamps (CI-15): без неё в бинарь вшиваются mtime и время создания файлов console/dist —
# у каждой сборки свои, бинарь невоспроизводим (repro беты 43320711328).
rust-embed = { version = "8.14.0", features = ["deterministic-timestamps"] }
rustls = "0.23.46"
rustls-native-certs = "0.8.5"
rustls-pemfile = "2.2.0"
rustls-webpki = { version = "0.103.16", default-features = false, features = ["alloc"] }
schemars = "1.2.3"
seccompiler = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
# BATV: SHA-1 под HMAC; поколение digest 0.11, как hmac 0.13 и sha2 (копия 0.10 у axum/tungstenite остаётся).
sha1 = "0.11.0"
sha2 = "0.11.1"
smtp-proto = "0.2.5"
socket2 = "0.6.5"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "derive", "uuid", "time", "json"] }
tantivy = "0.27.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
# Раздел [cli] design/tokens.toml при сборке (решение 120); на тех же toml_parser и toml_datetime, что в дереве.
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26.6"
# Клиент WebSocket для тестов JMAP push (RFC 8887); та же версия, что у axum (фича `ws`).
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
tokio-util = "0.7.20"
tower = "0.5.3"
# CORS в Admin API готовым слоем (решение 68; tp-admin). Ветка 0.6 — та же, что у reqwest: одна версия в дереве.
tower-http = { version = "0.6.11", default-features = false, features = ["cors"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = "6.0.0"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
# Разбор подмножества шаблонов STIX 2.1 (решение 126, thepost): ipv4/ipv6-addr, domain-name, url, file:hashes;
# крейтов STIX нет — только равенство значений. Та же версия, что уже в дереве через toml.
winnow = "1.0.4"
x509-parser = "0.18.1"
# Сертификаты в CMS SignedData (JMAP-22); реэкспорт der и spki — кодирование DER для cms.
x509-cert = { version = "0.2.5", default-features = false }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
zstd = { version = "0.14.3", default-features = false }

[profile.dev]
debug = "line-tables-only"

# mail-parser в тестах — как в выпуске: его debug_assert!(false) на битом MIME роняет тест, а выпуск разбирает
# такое письмо частично (FIX-06, FIX-07; фаззинг — так же, crates/*/fuzz/Cargo.toml).
[profile.dev.package.mail-parser]
debug-assertions = false
overflow-checks = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
