[package]
name = "thepost"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Веб-консоль вшивается в бинарный файл: `cargo build -p thepost --features console`. По умолчанию выключена.
console = ["tp-admin/console"]
# Веб-клиент (web/dist, полоса mod-webmail, WEB-01) вшивается в бинарный файл и раздаётся слушателем JMAP
# под /mail/ (`crates/thepost/src/webmail.rs`, секция `modules.webmail`): `cargo build -p thepost --features
# webmail`. По умолчанию выключена.
webmail = ["dep:tp-webmail", "tp-webmail/embed"]
# Вход по Kerberos (GSSAPI, SRS 6.1): `cargo build -p thepost --features gssapi`; сборке нужны заголовки
# libkrb5 (libkrb5-dev) и libclang, узлу — libgssapi_krb5. По умолчанию выключена.
gssapi = ["tp-auth/gssapi"]

[dependencies]
tp-contracts.workspace = true
tp-platform.workspace = true
tp-meta.workspace = true
tp-blob.workspace = true
tp-mailstore.workspace = true
tp-cluster.workspace = true
tp-auth.workspace = true
tp-smtp.workspace = true
tp-sieve.workspace = true
tp-imap.workspace = true
tp-jmap.workspace = true
tp-dav.workspace = true
tp-search.workspace = true
tp-admin.workspace = true
tp-admin-client.workspace = true
tp-sys.workspace = true
tp-tui.workspace = true
tp-webmail = { workspace = true, optional = true }
schemars.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
clap.workspace = true
futures.workspace = true
mail-auth.workspace = true
mail-parser.workspace = true
prometheus-client.workspace = true
reqwest.workspace = true
ring.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
winnow.workspace = true
x509-parser.workspace = true
zip.workspace = true

[dev-dependencies]
tp-testkit.workspace = true
base64.workspace = true
tempfile.workspace = true
# Записи журнала переписки в тестах CLI (`journal_commands_against_admin_api`, ADM-52).
time.workspace = true
tokio-rustls.workspace = true
# Запросы к маршрутам веб-клиента в тестах (`crates/thepost/src/webmail.rs`, WEB-01) — как в tp-admin.
tower = { workspace = true, features = ["util"] }
