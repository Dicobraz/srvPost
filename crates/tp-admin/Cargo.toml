[package]
name = "tp-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Веб-консоль (console/dist) вшивается в бинарный файл; без фичи — страница «консоль не собрана».
console = ["dep:rust-embed"]

[dependencies]
tp-contracts.workspace = true
tp-mailstore.workspace = true
tp-auth.workspace = true
async-trait.workspace = true
schemars.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
tokio.workspace = true
tokio-rustls.workspace = true
tower-http.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
rust-embed = { workspace = true, optional = true }
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing.workspace = true
utoipa.workspace = true
# Выгрузка записей журнала на HTTPS-эндпоинт внешнего архива (ADM-52); та же версия и фичи, что у
# tp-admin-client.
reqwest.workspace = true
# Знак брендинга — полный разбор PNG с Limits (ADM-48); та же версия и фичи, что у tp-tui (DEPS-17), в Cargo.lock
# новых крейтов нет.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Выгрузка беседы: письма `.eml` в архиве ZIP (ADM-50); та же версия и фичи, что у tp-search и thepost.
zip.workspace = true

[dev-dependencies]
tp-testkit.workspace = true
bytes.workspace = true
futures.workspace = true
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
