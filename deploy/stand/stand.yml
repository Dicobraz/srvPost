# Стенд SMB и нагрузка (APP-D Д.2–Д.7) одной командой: узел SMB (эталон deploy/ansible/smb.yml) с общими
# параметрами стенда (thresholds.yml: квота ящика, доверенный генератор), генератор нагрузки (imaptest, smtp-source,
# swaks, k6), учётные записи через thepost admin, наполнение ящиков (Д.3), сценарий (Д.6) в профиле порогов
# (speed — рабочие, thresholds — Д.5) с зондами и отчёт по критериям Д.7 (criteria.md) в
# deploy/stand/reports/<прогон>-<профиль>-<сценарий>/.
#   ansible-galaxy collection install -r deploy/ansible/requirements.yml
#   ansible-playbook -i <инвентарь> deploy/stand/stand.yml
#                    [-e stand_scenario=<base|peak|stress|x3|faults|long|bruteforce>]
#                    [-e stand_profile=<speed|thresholds>] [-e stand_duration=300]
# Теги: install — установка, provision — учётные записи, fill — наполнение, run — прогон. Например, только учётные
# записи и наполнение — --tags provision,fill; только прогон — --tags run. Пример инвентаря —
# deploy/stand/inventory.example.yml, параметры — roles/stand_generator/defaults/main.yml.
---
- name: Stand parameters
  hosts: smb:generator
  gather_facts: false
  tags: [always]
  tasks:
    - name: Load stand profiles (D.5, D.6)
      ansible.builtin.include_vars:
        file: thresholds.yml

    # Профиль порогов (stand_profiles) накладывает прогон (run.yml) — здесь только общее для обоих профилей.
    # Генератор — доверенный для ограничения частоты (ratelimit.trusted, решение 109): его адрес — IP-адрес.
    # FIX-12 (решение #22, вар. 1; тот же класс бага, что FIX-11): адрес генератора подставлялся как
    # ansible_host | default(имя узла) — на docker-стенде без ansible_host в конфиг узла уходило имя:
    # ratelimit.trusted (Vec<Cidr>, crates/tp-platform/src/ratelimit.rs) не парсился — узел не стартует;
    # smtp.queue.relay = «имя:2525» мог не резолвиться — исходящая почта молча копится в очереди. Здесь:
    # ansible_host, иначе IP из фактов генератора (ansible_default_ipv4), иначе assert — до применения конфига.
    # FIX-12 (решение #22, вар. 1; класс бага FIX-11): адрес генератора уходил в конфиг узла как
    # ansible_host | default(имя) — на docker-стенде без ansible_host это имя: ratelimit.trusted
    # (Vec<Cidr>, crates/tp-platform/src/ratelimit.rs) не парсится — узел не стартует; smtp.queue.relay
    # = «имя:2525» может не резолвиться — исходящая почта молча копится в очереди. Здесь: ansible_host,
    # если это IP; иначе адрес контейнера из фактов генератора; иначе assert до применения конфига узла.
    # Внимание: при docker-подключении ansible_host — имя контейнера, НЕ IP (иначе связь падает с 404),
    # адрес берётся из фактов — как в stand_generator (FIX-11, PR #21).
    - name: Gather generator facts for container address (docker, FIX-12)
      ansible.builtin.setup:
      when:
        - inventory_hostname in groups['generator']
        - ansible_connection | default('ssh') is search('(docker|docker_api)$')

    - name: Generator address from ansible_host or node facts (FIX-12)
      ansible.builtin.set_fact:
        stand_generator_address: >-
          {{ (hostvars[groups['generator'] | first].ansible_host | default(''))
             if (hostvars[groups['generator'] | first].ansible_host | default('')) is match('^[0-9A-Fa-f.]*[.:][0-9A-Fa-f.:]*$')
             else (hostvars[groups['generator'] | first].ansible_default_ipv4.address | default('')) }}
      when: inventory_hostname in groups['smb']

    - name: Generator address must be an IP before node config (FIX-12)
      ansible.builtin.assert:
        that: stand_generator_address | default('') is match('^[0-9A-Fa-f.]*[.:][0-9A-Fa-f.:]*$')
        fail_msg: >-
          Адрес генератора «{{ groups['generator'] | first }}» — «{{ stand_generator_address | default('<пусто>') }}»:
          не IP (ansible_host — не IP и не задан, фактов узла нет). ratelimit.trusted — список CIDR
          (crates/tp-platform/src/ratelimit.rs): имя не парсится, узел не стартует; smtp.queue.relay = «имя:2525»
          может не резолвиться — исходящая почта молча копится в очереди (FIX-12, как потерянные прогоны Д.7).
          Задайте ansible_host генератора — IP-адрес (для docker-подключений ansible_host остаётся именем
          контейнера: адрес возьмётся из фактов — как в stand_generator, FIX-11).
      when: inventory_hostname in groups['smb']

    # FIX-18: генератор — доверенный клиент стенда и для экрана соединений (screen.max_rate, 60/IP за окно):
    # fill 25 соединений + swaks/imaptest/k6 с одного адреса превышают её — 421 × 267 на Д.7 (beta.3).
    - name: Apply common stand parameters, trusted generator and relay of outgoing mail to smtp-sink
      ansible.builtin.set_fact:
        thepost_config_extra: >-
          {{ stand_common
             | combine({'ratelimit': {'trusted': [stand_generator_address] + stand_trusted}}, recursive=true)
             | combine({'smtp': {'queue': {'relay': stand_generator_address ~ ':' ~ stand_sink_port | default(2525)}}},
                       recursive=true)
             | combine({'screen': {'exempt': [stand_generator_address ~ '/32'] + (stand_screen_exempt | default([]))}},
                       recursive=true)
             | combine(stand_config_extra | default({}), recursive=true, list_merge='replace') }}
      when: inventory_hostname in groups['smb']

- name: SMB node
  ansible.builtin.import_playbook: ../ansible/smb.yml
  tags: [install]

# Основа профилей стенда: конфигурация установки; прогон накладывает на неё stand_profiles[stand_profile].
- name: Save base configuration of SMB node for stand profiles
  hosts: smb
  become: true
  tags: [install]
  tasks:
    - name: Save base configuration
      ansible.builtin.copy:
        src: /etc/thepost/config.yaml
        dest: /etc/thepost/config.stand-base.yaml
        remote_src: true
        owner: root
        group: thepost
        mode: "0640"

- name: Load generator
  hosts: generator
  become: true
  tags: [install]
  roles:
    - stand_generator

- name: Stand accounts (thepost admin)
  hosts: generator
  become: true
  tags: [provision]
  tasks:
    - name: Provision accounts
      ansible.builtin.import_role:
        name: stand_generator
        tasks_from: provision.yml

- name: Fill mailboxes (D.3)
  hosts: generator
  become: true
  tags: [fill]
  tasks:
    - name: Fill mailboxes
      ansible.builtin.import_role:
        name: stand_generator
        tasks_from: fill.yml

- name: Run scenario
  hosts: generator
  become: true
  tags: [run]
  vars:
    stand_scenario: base
  tasks:
    - name: Run scenario and report D.7
      ansible.builtin.import_role:
        name: stand_generator
        tasks_from: run.yml
