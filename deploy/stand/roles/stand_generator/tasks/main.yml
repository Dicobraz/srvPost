# Генератор нагрузки стенда SMB. Повторный прогон ничего не меняет.
---
- name: Check parameters
  ansible.builtin.assert:
    that:
      - stand_provision in ['admin', 'none', 'ldif']
      - stand_provision == 'admin' or stand_user_password | length > 0
    fail_msg: "stand_provision — admin, none или ldif; для none и ldif задайте stand_user_password (ansible-vault)"

- name: Install load tools
  ansible.builtin.apt:
    name: [postfix, swaks, podman, curl, python3]
    state: present
    update_cache: true
    cache_valid_time: 3600
  environment:
    DEBIAN_FRONTEND: noninteractive

# Postfix нужен только ради smtp-source и smtp-sink: свой MTA генератора не работает.
- name: Stop Postfix MTA on generator
  ansible.builtin.systemd_service:
    name: postfix
    state: stopped
    enabled: false

# FIX-11: первое поле /etc/hosts — только IP (hosts(5)). При docker-подключении без ansible_host адресом
# становилось имя узла, строка «имя mail.stand.test» не резолвилась, и нагрузка молча ползла (Д.7, 16–17.11).
# Здесь: для docker-подключения берём адрес контейнера из фактов узла; иначе имя — последний резерв: роль
# резолвит его с генератора (getent) и падает ДО записи, если адрес — не IP и не резолвится.
- name: Take SMB container address from node facts (docker, FIX-11)
  ansible.builtin.set_fact:
    stand_smb_address: "{{ hostvars[stand_smb_host].ansible_default_ipv4.address }}"
  when:
    - hostvars[stand_smb_host].ansible_connection | default('ssh') is search('(docker|docker_api)$')
    - hostvars[stand_smb_host].ansible_default_ipv4.address is defined
    - stand_smb_address is not match('^[0-9A-Fa-f.]*[.:][0-9A-Fa-f.:]*$')

- name: Remember name fallback for SMB address (FIX-11)
  ansible.builtin.set_fact:
    stand_smb_address_is_name: "{{ stand_smb_address is not match('^[0-9A-Fa-f.]*[.:][0-9A-Fa-f.:]*$') }}"

- name: Look up SMB node address on generator (FIX-11)
  ansible.builtin.command:
    argv: [getent, ahosts, "{{ stand_smb_address }}"]
  register: stand_smb_lookup
  changed_when: false
  failed_when: false
  check_mode: false

- name: SMB address must be an IP or resolvable from generator (FIX-11)
  ansible.builtin.assert:
    that: stand_smb_lookup.stdout_lines | default([]) | length > 0
    fail_msg: >-
      Адрес узла SMB «{{ stand_smb_host }}» — «{{ stand_smb_address }}»: не IP и не резолвится с генератора
      (getent пуст). Строка «{{ stand_smb_address }} {{ stand_smb_hostname }}» в /etc/hosts была бы мёртвой:
      getaddrinfo её игнорирует, имя уходит в docker-DNS (127.0.0.11) и наружу, каждый SMTP/IMAP-коннект
      висит в getaddrinfo десятки секунд — нагрузка молча ползёт (FIX-11, прогоны Д.7 16–17.11).
      Задайте ansible_host узла SMB в инвентаре — IP-адрес (или stand_smb_address = IP), либо обеспечьте
      резолв имени узла с генератора (DNS / сеть стенда).

- name: Write resolved IP of SMB node into address fact (FIX-11)
  ansible.builtin.set_fact:
    stand_smb_address: "{{ stand_smb_lookup.stdout_lines | first | split | first }}"

- name: Warn about name fallback for SMB address (FIX-11)
  ansible.builtin.debug:
    msg: >-
      ВНИМАНИЕ (FIX-11): адрес узла SMB «{{ stand_smb_host }}» взят резолвом имени с генератора
      ({{ stand_smb_address }}) — резолв зависит от DNS стенда. Надёжнее задать ansible_host — IP-адрес
      (или stand_smb_address = IP) в инвентаре.
  when: stand_smb_address_is_name | bool

- name: Resolve SMB host name on generator
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "\\s{{ stand_smb_hostname | regex_escape }}$"
    line: "{{ stand_smb_address }} {{ stand_smb_hostname }}"

- name: Create stand directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ stand_etc_dir }}", mode: "0700" }
    - { path: "{{ stand_dir }}", mode: "0755" }
    - { path: "{{ stand_dir }}/corpus", mode: "0755" }
    - { path: "{{ stand_dir }}/reports", mode: "0755" }
    - { path: "{{ stand_dir }}/sink", mode: "0777" }

- name: Read CA of SMB node (internal certificate)
  ansible.builtin.slurp:
    src: "{{ hostvars[stand_smb_host].thepost_pki_dir | default('/etc/thepost/pki') }}/ca.pem"
  delegate_to: "{{ stand_smb_host }}"
  register: stand_ca
  when: hostvars[stand_smb_host].thepost_tls_mode | default('acme') == 'internal'

- name: Install CA of SMB node
  ansible.builtin.copy:
    content: "{{ stand_ca.content | b64decode }}"
    dest: "{{ stand_etc_dir }}/ca.pem"
    owner: root
    group: root
    mode: "0644"
  when: stand_ca is not skipped

- name: Download k6
  ansible.builtin.get_url:
    url: "{{ stand_k6_url }}"
    checksum: "{{ stand_k6_checksum }}"
    dest: "/var/cache/k6-v{{ stand_k6_version }}.tar.gz"
    mode: "0644"

- name: Unpack k6
  ansible.builtin.unarchive:
    src: "/var/cache/k6-v{{ stand_k6_version }}.tar.gz"
    dest: /opt
    remote_src: true
    creates: "/opt/k6-v{{ stand_k6_version }}-linux-{{ stand_k6_arch }}/k6"

- name: Link k6
  ansible.builtin.file:
    src: "/opt/k6-v{{ stand_k6_version }}-linux-{{ stand_k6_arch }}/k6"
    dest: /usr/local/bin/k6
    state: link

- name: Pull imaptest image
  containers.podman.podman_image:
    name: "{{ stand_imaptest_image }}"

- name: Install smtp-sink service (receiver of outgoing mail)
  ansible.builtin.template:
    src: thepost-stand-sink.service.j2
    dest: /etc/systemd/system/thepost-stand-sink.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart smtp-sink

- name: Start smtp-sink
  ansible.builtin.systemd_service:
    name: thepost-stand-sink
    state: started
    enabled: true
    daemon_reload: true

- name: Install stand scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ stand_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop: [make-corpus.py, jmap.js, dav.js, probe.js, run-scenario.sh, fill.py, fill-dav.py, probes.py, criteria.py]

- name: Build message corpus (D.3)
  ansible.builtin.command:
    argv:
      - python3
      - "{{ stand_dir }}/make-corpus.py"
      - "{{ stand_dir }}/corpus"
      - "{{ stand_corpus_messages }}"
      - "{{ stand_model.message_size_kb }}"
      - "{{ stand_model.attachment_share }}"
      - "{{ stand_model.attachment_size_kb }}"
      - "{{ stand_model.mime_duplicate_share }}"
    creates: "{{ stand_dir }}/corpus/imaptest.mbox"
