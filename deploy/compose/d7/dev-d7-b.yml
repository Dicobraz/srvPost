# Диагностика Д.7, прогон B (w/laptop-d7): pg_wal — на отдельном docker-томе (pgwal-b), данные — на новом
# томе pgdata-b (протокол эталона: fill перед прогонами, прогоны A и B — на одинаковых чистых наполнениях).
# postgres:16 с обёрткой entrypoint (wal-entrypoint.sh): на пустом PGDATA — initdb с --waldir (переменные
# окружения dev.yml: POSTGRES_USER/PASSWORD/DB, POSTGRES_INITDB_ARGS), дальше — оригинальный docker-entrypoint.
# Пересоздаётся ТОЛЬКО postgres-tls (--no-deps); узел и остальные тома не трогаются.
#   THEPOST_IMAGE=thepost:beta5 docker compose -f deploy/compose/dev.yml -f deploy/compose/d7/dev-d7-node.yml \
#     -f deploy/compose/d7/dev-d7-b.yml --profile smb up -d --no-deps postgres-tls
# Роли и БД на новом томе — отдельно (пароли из OpenBao, см. NOTES-d7.md, прогон B).
services:
  postgres-tls:
    entrypoint: ["/d7/wal-entrypoint.sh"]
    volumes:
      - pgdata-b:/var/lib/postgresql/data
      - pgwal-b:/wal
      - ./d7/wal-entrypoint.sh:/d7/wal-entrypoint.sh:ro
volumes:
  pgdata-b:
  pgwal-b:
