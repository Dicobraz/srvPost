# Пресет edge — приём почты в DMZ (SRS 2.6, решение 2026-10-30): без доступа к БД и BLOB-хранилищу (их адресов
# в конфигурации нет), без очереди и состояния — письмо после проверок передаётся в той же SMTP-сессии на
# transport (взаимный TLS); недоступен внутренний контур — временный отказ 4xx, повторы выполняет отправитель.
# Проверка получателей — по реплике списка адресов: узлы transport передают подписанный снимок и
# инкрементальные обновления (соединения инициируются из внутреннего контура). Секреты (ключ TLS приёма,
# канал к transport) — из хранилища напрямую (секция secrets).
# Полный перечень секций: thepost config schema.

domain: example.ru

roles: [edge]
