# Роль thepost: бинарный файл, пользователь, юнит systemd, config.yaml и сертификат клиентских протоколов
# (эталон SMB, SRS 1.2, 5.6). Юнит и sysusers — deploy/systemd; config.yaml — пресет deploy/config/all.yaml
# (единственная конфигурация SMB, решение 105) со значениями ниже.
---
# Основной домен и имя узла (SMTP banner/HELO, сертификат клиентских протоколов). Локальные домены SMTP — принятые
# домены организации в БД (решение 96): `thepost admin init` заводит домен адреса администратора, другие —
# `thepost admin transport domain create <домен>`.
thepost_domain: example.ru
thepost_hostname: "mail.{{ thepost_domain }}"

# Бинарный файл: thepost_binary_url (+ thepost_binary_checksum "sha256:…") или файл на управляющей машине.
thepost_binary_url: ""
thepost_binary_checksum: ""
thepost_binary_src: "{{ playbook_dir }}/../../target/release/thepost"
thepost_binary_path: /usr/local/bin/thepost
# Системные библиотеки бинарного файла: libgssapi_krb5 (MIT Kerberos) — выпуск и бета собраны с фичей gssapi
# (решение 107, CI-12), без неё thepost не запускается. Debian, Ubuntu, Astra Linux — libgssapi-krb5-2; РЕД ОС,
# AlmaLinux, RHEL — krb5-libs.
thepost_system_packages: "{{ ['libgssapi-krb5-2'] if ansible_pkg_mgr == 'apt' else ['krb5-libs'] }}"

# Вход по Kerberos (SASL GSSAPI, секция auth.gssapi): keytab с ключами принципалов служб smtp/<узел>, imap/<узел>,
# sieve/<узел> (deploy/README.md) — файл на управляющей машине; пусто — Kerberos выключен. Роль кладёт его в
# thepost_gssapi_keytab (0640 root:thepost) и задаёт KRB5_KTNAME в drop-in юнита gssapi.conf. Остальные поля
# секции — thepost_gssapi, например { hostname: mail.example.ru, realms: { EXAMPLE.RU: example.ru } }.
thepost_gssapi_keytab_src: ""
thepost_gssapi_keytab: /etc/thepost/thepost.keytab
thepost_gssapi: {}

# Сертификат клиентских протоколов (SMTP, IMAP, ManageSieve, JMAP, служебный HTTP; решение 101). Ключ — только в
# OpenBao: секрет thepost/tls#key (tls.key пресета, решение 100), на диске ВМ его нет; цепочка — файл секции tls.
# thepost перечитывает пару без перезапуска.
#   acme     — встроенный клиент ACME thepost (по умолчанию для публичного имени; секция acme, SRS 6.2, HTTP-01 на
#              порту 80 — сокет thepost-http.socket, firewalld открывает 80): ключ записывает сам узел (PLT-29),
#              цепочка — в /var/lib/thepost/tls; продление — сам thepost;
#   internal — внутренний CA роли thepost_pki (стенд, тест; клиентам нужен {{ thepost_pki_dir }}/ca.pem);
#   files    — свои PEM с управляющей машины: thepost_tls_cert_src (цепочка), thepost_tls_key_src (ключ — в OpenBao).
thepost_tls_mode: acme
thepost_tls_names: ["{{ thepost_hostname }}"]
thepost_tls_cert_src: ""
thepost_tls_key_src: ""
# ACME: контакт учётной записи и каталог (пусто — Let's Encrypt; staging —
# https://acme-staging-v02.api.letsencrypt.org/directory). Ключ сертификата — секрет tls.key пресета (запись —
# политика узла deploy/openbao/thepost-policy.hcl).
thepost_acme_email: ""
thepost_acme_directory_url: ""

# Внутренние каналы — только TLS с проверкой имени (решение 2026-10-30): CA — роль thepost_pki.
thepost_internal_ca_file: "{{ thepost_pki_dir | default('/etc/thepost/pki') }}/ca.pem"
thepost_db_url: >-
  postgres://thepost@localhost:5432/thepost?sslmode=verify-full&sslrootcert={{ thepost_internal_ca_file }}
# Другие адреса кластера PostgreSQL (database.urls): узел выбирает первый доступный для записи из thepost_db_url и
# списка (Enterprise-ВМ — узлы данных pg_auto_failover, deploy/ansible/pg-ha.yml); пусто — единственный адрес.
# Сроки повтора и поиска primary — thepost_db_failover (database.failover, например { retry_for: 30s }).
thepost_db_urls: []
thepost_db_failover: {}
thepost_secrets_url: "{{ openbao_api_addr | default('https://localhost:8200') }}"
thepost_secrets_role_id_file: "{{ openbao_thepost_role_id_file | default('/etc/thepost/openbao/role_id') }}"
thepost_secrets_secret_id_file: >-
  {{ openbao_thepost_secret_id_file | default('/etc/thepost/credentials/openbao-secret-id') }}
# Узел OpenBao с токеном администратора (роль openbao, openbao_cli_env), через который роль записывает ключ TLS в
# секрет thepost/tls: эталон SMB — эта ВМ; малый Enterprise — узел инициализации кластера OpenBao.
thepost_openbao_from: "{{ inventory_hostname }}"

# Порты клиентских протоколов (25, 465, 587, 143, 993, 443 и ManageSieve 4190) слушает только systemd (юниты
# thepost-*.socket, решение 102) — у процесса нет capabilities (SRS 2.7, DEP-08), перезапуск не закрывает сокеты.
# Слушатели — из пресета (0.0.0.0:<порт>); другой адрес — drop-in юнита сокета (ListenStream=) и тот же адрес в
# thepost_config_extra.
thepost_sockets: [smtp, submissions, submission, imap, imaps, https, managesieve]
# Admin API — только внутренний адрес (SRS 6.8): loopback, частные сети.
thepost_admin_listen: "127.0.0.1:8443"
# Календари и контакты (роль dav: /dav/, /.well-known/caldav и carddav): пусто — на слушателе jmap, один порт 443
# с JMAP; адрес:порт — отдельный слушатель http.dav (порт — и в thepost_firewall_ports). Лимиты — секция dav.
thepost_dav_listen: ""
thepost_dav: {}
# Роль maintenance (секция maintenance) — поверх пресета: purge_interval, admin_token_retention, gal_interval,
# verify (enabled, at, interval, lease_name, lease_ttl), например { verify: { at: "02:30" } }; пусто — умолчания
# пресета. Сроки хранения надгробий DAV и журналов — thepost_config_extra.meta (dav.tombstone_ttl,
# sieve.vacation_log_ttl, delivery.retention).
thepost_maintenance: {}
# Вход администратора `thepost admin login --oidc` (секция cli.oidc, RFC 8628) у поставщика auth.oidc
# (thepost_config_extra.auth.oidc) — поверх пресета, например { client_id: thepost-cli }; пусто — вход с устройства
# выключен.
thepost_cli_oidc: {}
# Владелец схемы для миграций (database.owner; роль postgresql, секрет thepost/db-owner в OpenBao): узел входит
# ролью thepost (thepost_app), схему меняет только при запуске миграций (meta.migrate_on_start).
thepost_db_owner_role: "{{ postgresql_owner_role | default('thepost_owner') }}"

# Службы этой ВМ (эталон SMB), с которыми запускается thepost (drop-in smb.conf): юнит PostgreSQL — по роли postgresql
# (Debian — postgresql.service, семейство RHEL — postgresql-<версия>.service).
thepost_local_units: >-
  {{ [(postgresql_service | default('postgresql')) ~ '.service', 'openbao.service', 'rspamd.service']
     + (['clamav-milter.service'] if thepost_clamav | bool else []) }}
# Порты клиентских протоколов в firewalld (если он включён): SMTP, submissions, submission, IMAP, IMAPS, HTTPS,
# ManageSieve.
thepost_firewall_ports: [25, 465, 587, 143, 993, 443, 4190]

# Фильтры Milter: Rspamd (роль rspamd) и, при thepost_clamav, clamav-milter (роль clamav_milter).
thepost_rspamd_milter_address: "{{ rspamd_milter_address | default('127.0.0.1:11332') }}"
thepost_clamav: false
thepost_clamav_milter_address: "{{ clamav_milter_address | default('127.0.0.1:7357') }}"
# Проверять и почту пользователей (submission), не только входящую.
thepost_milter_submission: false

# Ключи метки ответа (SMTP-51, решение 125 в; секция smtp.reply, BATV — те же ключи): секрет thepost/reply
# (thepost_reply_secret), поле — id ключа (1–16 байт [a-z0-9.-]), значение — случайные 32 байта; создаёт роль
# при первом прогоне. Ротация: добавить новый id в начало списка — прогон создаст ключ, а активным в config.yaml
# будет первый (метки подписывает ровно один ключ); прежний id оставить в списке — метки прежних писем проверяют
# все ключи набора до smtp.reply.max_age; когда ответы на те письма больше не приходят, id убрать из списка.
thepost_reply_keys: [k1]
thepost_reply_secret: thepost/reply
# Срок признака ответа (smtp.reply.max_age, решение 125 а) и BATV (smtp.batv, решение 125 г): режим log —
# только журнал и метрика (переход), затем enforce — отказ `550 5.7.1` bounce без валидной метки; exempt —
# адреса и домены без метки (рассылки, ezmlm).
thepost_reply_max_age: 30d
thepost_batv_mode: log
thepost_batv_valid_for: 7d
thepost_batv_exempt: []

# Окно W (blob.gc.window, SRS 3.5): тело письма удаляется не раньше W после удаления последней ссылки; W не меньше
# глубины самой старой точки восстановления. С резервным копированием (роль pgbackrest) — глубина PITR + неделя между
# полными копиями + сутки запаса; пусто — значение узла по умолчанию (7d).
thepost_blob_gc_window: >-
  {{ (thepost_backup_retention_days | default(7) | int + 8) ~ 'd' if thepost_backup | default(true) | bool else '' }}

# Журналирование переписки (секция journal, SRS 4.9; DEP-58): по умолчанию выключено — включается явно.
# Профиль SMB — локальный каталог (journal.local пресета): записи только добавляет сервер, от администратора
# ОС защиты нет — thepost doctor предупреждает (риск 23); для требований неизменяемости — S3 с Object Lock
# (journal.s3, бакет отдельный от BLOB ящиков, режим governance по умолчанию, compliance — явно и только
# с явным сроком, риск 21). Каталог — thepost_journal_local_dir (внутри /var/lib/thepost юнита; вне его —
# drop-in ReadWritePaths=, как у BLOB). Правила журналирования — данные организации (Admin API), не файл узла.
thepost_journal_enabled: false
thepost_journal_local_dir: /var/lib/thepost/journal
# Поля секции journal поверх пресета (рекурсивно), например:
#   thepost_journal_enabled: true
#   thepost_journal:
#     s3:                                   # S3 с Object Lock вместо локального каталога
#       bucket: thepost-journal
#       lock_mode: governance               # compliance — только с retention
#       retention: 2555d
#       endpoint: https://s3.example.ru:8333
#       path_style: true
#       credentials:
#         access_key_id: { secret: "thepost/s3#access_key_id" }
#         secret_access_key: { secret: "thepost/s3#secret_access_key" }
#       tls: { ca_file: /etc/thepost/pki/ca.pem }
#     export: { address: archive.example.ru:25 }   # выгрузка .eml с конвертом во внешний архив
# Сюда же — local.dir (переопределить каталог SMB); заданы и s3, и local — ошибка конфигурации.
thepost_journal: {}

# Дополнительные параметры config.yaml — рекурсивно поверх эталона (списки заменяются), например:
#   thepost_config_extra: { auth: { ldap: { … } }, meta: { retention: { trash_retention: 15m } } }
thepost_config_extra: {}

# Ожидание готовности после запуска (/healthz/ready служебного HTTP, 127.0.0.1:8081). thepost_wait_ready: false —
# не ждать: плейбук завершается успешно с предупреждением, если узел не готов (решение 79; новый сервер перед
# restore.yml — ключи DKIM, SRS и ARC вернутся только из снимка OpenBao, docs/INSTALL.md).
thepost_wait_ready: true
thepost_service_http_port: 8081
thepost_ready_retries: 30
thepost_ready_delay: 2
