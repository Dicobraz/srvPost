# Веб-клиент (WEB-01, SRS 1.3): сборка web/dist для вшивания в бинарный файл (фича `webmail` крейта thepost).
# Одна версия Node и один порядок шагов на PR (ci.yml, job webmail) и выпуске (.github/actions/release-build).
# Без web/package-lock.json шаги пропускаются, `cargo-args` пустой — сборка без веб-клиента.
# checks: 'true' — перед сборкой проверка типов, линтер, vitest, npm audit по боевым зависимостям
# и лицензии боевых зависимостей по списку [licenses] allow из deny.toml (licensee, SPDX-выражения).
name: webmail
description: Сборка web/dist (и проверки на PR)

inputs:
  checks:
    description: Проверки перед сборкой (PR)
    default: 'false'
  node-version:
    description: Версия Node (LTS)
    default: '26'

outputs:
  cargo-args:
    description: Аргументы cargo build -p thepost для веб-клиента (`--features webmail` или пусто)
    value: ${{ steps.args.outputs.args }}

runs:
  using: composite
  steps:
    - id: has
      shell: bash
      run: |
        if [ -f web/package-lock.json ]; then
          echo yes=true >> "$GITHUB_OUTPUT"
        else
          echo "web/package-lock.json нет — веб-клиент не собирается"
          echo yes=false >> "$GITHUB_OUTPUT"
        fi
    - if: steps.has.outputs.yes == 'true'
      uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: web/package-lock.json
    - if: steps.has.outputs.yes == 'true'
      shell: bash
      working-directory: web
      run: npm ci --no-fund --no-audit
    - if: steps.has.outputs.yes == 'true' && inputs.checks == 'true'
      name: Типы, линтер, vitest
      shell: bash
      working-directory: web
      run: |
        npm run typecheck
        npm run lint
        npm test
    - if: steps.has.outputs.yes == 'true' && inputs.checks == 'true'
      name: npm audit (боевые зависимости)
      shell: bash
      working-directory: web
      run: npm audit --omit=dev
    - if: steps.has.outputs.yes == 'true' && inputs.checks == 'true'
      name: Лицензии по deny.toml
      shell: bash
      working-directory: web
      run: |
        # Конфиг licensee — только из deny.toml (не в репозитории); CLI licensee 12 флаг --licenses не читает.
        python3 - <<'EOF'
        import json, tomllib
        allow = tomllib.load(open("../deny.toml", "rb"))["licenses"]["allow"]
        json.dump({"licenses": {"spdx": allow}, "corrections": True}, open(".licensee.json", "w"))
        print("разрешены:", ", ".join(allow))
        EOF
        npx --yes licensee@12.0.2 --production --errors-only
        rm .licensee.json
    - if: steps.has.outputs.yes == 'true'
      shell: bash
      working-directory: web
      run: |
        npm run build
        test -f dist/index.html || { echo "::error::npm run build не создал web/dist/index.html"; exit 1; }
    - id: args
      shell: bash
      run: |
        args=
        if [ "${{ steps.has.outputs.yes }}" = true ]; then args="--features webmail"; fi
        echo "cargo: ${args:-без веб-клиента}"
        echo "args=$args" >> "$GITHUB_OUTPUT"
